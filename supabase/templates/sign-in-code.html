<!-- Sign in email with a 6 digit code (D-211, D-216). Paste this into Supabase,
     Authentication, Emails, for both "Magic link" and "Confirm signup".
     Subject for both: Your Aptbrix sign in code: {{ .Token }}
     No link on purpose: a link to another domain is a spam signal, and it fails when opened
     in a different browser from the one the sign in started in. -->
<div style="margin:0;padding:24px 16px;background:#f5f7fb;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#0f172a;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e9edf3;border-radius:16px;padding:28px 24px;">
    <p style="margin:0 0 4px;font-size:14px;font-weight:600;color:#1e47d9;">Aptbrix</p>
    <h1 style="margin:0 0 12px;font-size:20px;line-height:28px;">Your sign in code</h1>
    <p style="margin:0 0 20px;font-size:15px;line-height:22px;color:#475569;">Enter this code on the Aptbrix sign in screen. It works once.</p>
    <p style="margin:0 0 20px;padding:14px 0;background:#eef3ff;border-radius:12px;text-align:center;font-size:32px;font-weight:700;letter-spacing:8px;color:#14275f;">{{ .Token }}</p>
    <p style="margin:0;font-size:13px;line-height:20px;color:#586679;">If you didn't ask to sign in, ignore this email. Nobody can sign in without this code. We will never ask you for this code by phone, WhatsApp or text.</p>
  </div>
</div>
