<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Receipts</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icon.png" alt="" width="28" height="28" />
      <div>
        <p class="name">Receipts</p>
        <p class="sub">Apply with proof</p>
      </div>
    </header>
    <p id="intro">Send the job on this page to Receipts. We copy the advert only, nothing else from the page.</p>
    <button id="tailor" class="primary" type="button">Tailor my CV to this job</button>
    <button id="real" class="secondary" type="button">Is this job real?</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p class="tip">Tip: if the page shows many jobs, open the one you want first, or highlight its text.</p>
    <a id="open" href="#" class="link">Open Receipts</a>
    <script type="module" src="popup.js"></script>
  </body>
</html>
